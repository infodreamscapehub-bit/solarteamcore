name: Build FlowCity

on:
  push:
  workflow_dispatch:

jobs:
  mod:
    name: FlowCityCore (Forge 1.16.5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'
      - name: Build
        working-directory: mod
        run: gradle build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: FlowCityCore-mod
          path: mod/build/libs/FlowCityCore-1.16.5-*.jar

  plugin:
    name: FlowCityBridge (Mohist/Arclight)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        working-directory: plugin
        run: |
          chmod +x gradlew
          for i in 1 2 3 4 5 6; do ./gradlew --version --no-daemon && break; echo "retry $i"; sleep 20; done
          ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FlowCityBridge-plugin
          path: plugin/build/libs/FlowCityBridge-*.jar

  release:
    name: Publish jars (release "latest")
    needs: [mod, plugin]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest dist/*.jar --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "FlowCity (build automat)" --notes "Jar-uri construite automat din commit $GITHUB_SHA"
