name: Build FlowCity

on:
  push:
  workflow_dispatch:

jobs:
  mod:
    name: FlowCityCore (Forge 1.20.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Stamp build
        run: |
          mkdir -p mod/src/main/resources
          printf 'build=%s\nsha=%s\ntime=%s\n' "${{ github.run_number }}" "${{ github.sha }}" "$(date +%s)" > mod/src/main/resources/build.properties
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build
        working-directory: mod
        run: gradle build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: FlowCityCore-mod
          path: mod/build/libs/FlowCityCore-1.20.1-*.jar

  mod116:
    name: FlowCityCore (Forge 1.16.5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Stamp build
        run: |
          mkdir -p mod116/src/main/resources
          printf 'build=%s\nsha=%s\ntime=%s\n' "${{ github.run_number }}" "${{ github.sha }}" "$(date +%s)" > mod116/src/main/resources/build.properties
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'
      - name: Build
        working-directory: mod116
        run: gradle build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: FlowCityCore-mod-1.16.5
          path: mod116/build/libs/FlowCityCore-1.16.5-*.jar

  plugin:
    name: FlowCityBridge (Mohist/Arclight)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Stamp build
        run: |
          mkdir -p plugin/src/main/resources
          printf 'build=%s\nsha=%s\ntime=%s\n' "${{ github.run_number }}" "${{ github.sha }}" "$(date +%s)" > plugin/src/main/resources/build.properties
      - name: Build
        working-directory: plugin
        run: |
          chmod +x gradlew
          for i in 1 2 3 4 5 6; do ./gradlew --version --no-daemon && break; echo "retry $i"; sleep 20; done
          ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FlowCityBridge-plugin
          path: plugin/build/libs/FlowCityBridge-*.jar

  release:
    name: Publish jars (release "latest")
    needs: [mod, mod116, plugin]
    # publicam si daca versiunea 1.16.5 nu s-a compilat (atunci lipseste doar jar-ul ei)
    if: always() && github.ref == 'refs/heads/main' && needs.mod.result == 'success' && needs.plugin.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 15
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          { echo "build=${{ github.run_number }}"; git log -n 8 --no-merges --pretty='- %s' | sed 's/Co-Authored-By.*//' ; } > notes.txt
          gh release create latest dist/*.jar --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "FlowCity (build automat)" --notes-file notes.txt
