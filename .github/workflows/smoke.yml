name: Smoke test server

on:
  push:
  workflow_dispatch:

jobs:
  smoke:
    name: Porneste server Forge 1.20.1 cu modul
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Porneste serverul
        working-directory: mod
        run: |
          mkdir -p run-server
          echo "eula=true" > run-server/eula.txt
          printf 'online-mode=false\nlevel-type=flat\nspawn-protection=0\nview-distance=4\n' > run-server/server.properties
          rm -f server.log
          touch server.log
          ( for i in $(seq 1 240); do
              if grep -q 'Done (' server.log || grep -q -E 'Exception in thread|Failed to start|FATAL|crash-' server.log; then break; fi
              sleep 3
            done
            sleep 5
            echo stop ) | timeout 420 gradle runServer --no-daemon > server.log 2>&1 || true
          echo "===== EXCEPTII / ERORI ====="
          grep -n -E 'Exception|ERROR|FATAL|crash|Caused by' server.log | head -80 || true
          echo "===== FINAL LOG ====="
          tail -40 server.log
          if grep -q 'Done (' server.log; then echo "SERVER OK"; else echo "SERVERUL NU A PORNIT"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-log
          path: |
            mod/server.log
            mod/run-server/logs/
            mod/run-server/crash-reports/

  smoke116:
    name: Porneste server Forge 1.16.5 cu modul
