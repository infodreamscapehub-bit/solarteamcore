name: Probe PlasmoVoice API
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Metadata
        run: |
          curl -s https://repo.plasmoverse.com/releases/su/plo/voice/api/server/maven-metadata.xml | head -40
      - name: Jar
        run: |
          V=$(curl -s https://repo.plasmoverse.com/releases/su/plo/voice/api/server/maven-metadata.xml | grep -o '<release>[^<]*' | sed 's/<release>//')
          echo "release=$V"
          curl -s https://repo.plasmoverse.com/releases/su/plo/voice/api/server/maven-metadata.xml | grep -o '<version>2\.1[^<]*' | tail -5
          for v in 2.1.0 2.1.1 2.1.2 2.1.3 2.1.4 2.1.5 2.1.6 2.1.7 2.1.8 2.1.9; do
            code=$(curl -s -o /tmp/s-$v.jar -w '%{http_code}' https://repo.plasmoverse.com/releases/su/plo/voice/api/server/$v/server-$v.jar); echo "$v $code"
          done
          ls -l /tmp/s-*.jar
          J=$(ls /tmp/s-*.jar | tail -1); mkdir /tmp/x; cd /tmp/x; unzip -q $J; 
          for c in su/plo/voice/api/server/PlasmoVoiceServer.class su/plo/voice/api/addon/annotation/Addon.class; do f=$(find . -name "$(basename $c)" | head -1); echo "$f"; [ -n "$f" ] && od -An -tu1 -j6 -N2 "$f"; done
          find . -name "*.class" | sed 's|/[^/]*$||' | sort -u | head -40
      - name: Dokka classes
        run: |
          cd /tmp/x
          javap -cp . su.plo.voice.api.server.PlasmoVoiceServer su.plo.voice.api.server.audio.source.ServerBroadcastSource su.plo.voice.api.server.audio.line.ServerSourceLine su.plo.voice.api.server.audio.capture.ServerActivation su.plo.voice.api.server.audio.capture.ServerActivationManager 2>&1 | head -150
