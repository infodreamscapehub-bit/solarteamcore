name: Probe PlasmoVoice API
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Resolve
        run: |
          mkdir -p /tmp/p && cd /tmp/p
          cat > settings.gradle <<'S'
          rootProject.name='p'
          S
          cat > build.gradle <<'S'
          plugins { id 'java' }
          repositories { mavenCentral(); maven { url 'https://repo.plasmoverse.com/releases' } }
          dependencies { compileOnly 'su.plo.voice.api:server:2.1.9' }
          tasks.register('cp') { doLast { configurations.compileClasspath.files.each { println it } } }
          S
          gradle cp -q --no-daemon 2>&1 | tail -40
      - name: Classes
        run: |
          cd /tmp/p
          mkdir -p ex && for j in $(gradle cp -q --no-daemon 2>/dev/null | grep '\.jar$'); do (cd ex && unzip -qo $j 2>/dev/null); done
          CP=$(gradle cp -q --no-daemon 2>/dev/null | grep '\.jar$' | tr '\n' ':')
          find ex -name '*Inject*' ; find ex -name '*Addon*' | head -30
          for c in su.plo.voice.api.addon.annotation.Addon su.plo.voice.api.server.audio.capture.ServerActivation\$PlayerActivationListener su.plo.voice.api.server.audio.capture.ServerActivation\$PlayerActivationStartListener su.plo.voice.api.server.audio.capture.ServerActivation\$PlayerActivationEndListener su.plo.voice.api.server.audio.capture.ServerActivation\$Result su.plo.voice.api.server.audio.capture.PlayerActivationInfo su.plo.voice.api.server.audio.source.BaseServerDirectSource su.plo.voice.api.server.audio.source.ServerDirectSource su.plo.voice.api.server.audio.line.BaseServerSourceLineManager su.plo.voice.api.server.player.VoicePlayerManager su.plo.voice.proto.packets.udp.serverbound.PlayerAudioPacket su.plo.voice.proto.packets.udp.serverbound.PlayerAudioEndPacket su.plo.voice.api.server.audio.capture.ServerActivation\$Requirements su.plo.voice.api.server.audio.source.ServerAudioSource su.plo.voice.api.addon.AddonContainer su.plo.voice.api.addon.AddonLoaderScope su.plo.voice.api.audio.capture.ActivationManager su.plo.voice.api.server.audio.line.ServerPlayerSetManager; do echo "=== $c"; javap -cp "$CP" "$c" 2>&1 | head -45 | cut -c1-300; done
          javap -v -cp "$CP" su.plo.voice.api.addon.annotation.Addon 2>&1 | grep -iE "default|AnnotationDefault|ANY|SERVER" | head
