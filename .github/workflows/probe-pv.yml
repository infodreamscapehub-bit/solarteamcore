name: Probe PlasmoVoice API
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Resolve
        run: |
          mkdir -p /tmp/p && cd /tmp/p
          cat > settings.gradle <<'S'
          rootProject.name='p'
          S
          cat > build.gradle <<'S'
          plugins { id 'java' }
          repositories { mavenCentral(); maven { url 'https://repo.plasmoverse.com/releases' } }
          dependencies { compileOnly 'su.plo.voice.api:server:2.1.9' }
          tasks.register('cp') { doLast { configurations.compileClasspath.files.each { println it } } }
          S
          gradle cp -q --no-daemon 2>&1 | tail -40
      - name: Classes
        run: |
          cd /tmp/p
          mkdir -p ex && for j in $(gradle cp -q --no-daemon 2>/dev/null | grep '\.jar$'); do (cd ex && unzip -qo $j 2>/dev/null); done
          CP=$(gradle cp -q --no-daemon 2>/dev/null | grep '\.jar$' | tr '\n' ':')
          for c in su.plo.slib.api.permission.PermissionDefault su.plo.voice.proto.packets.udp.bothbound.BaseAudioPacket su.plo.voice.proto.packets.tcp.serverbound.PlayerAudioEndPacket su.plo.voice.api.server.PlasmoBaseVoiceServer su.plo.voice.api.addon.InjectPlasmoVoice su.plo.voice.api.server.audio.line.BaseServerSourceLine\$Builder su.plo.voice.api.server.audio.line.ServerSourceLine su.plo.voice.api.server.audio.capture.ServerActivation\$Builder; do echo "=== $c"; javap -cp "$CP" "$c" 2>&1 | head -40 | cut -c1-260; done
          javap -v -cp "$CP" su.plo.voice.api.addon.InjectPlasmoVoice 2>&1 | grep -iE "Target|Retention|ElementType|RuntimeVisible" | head
