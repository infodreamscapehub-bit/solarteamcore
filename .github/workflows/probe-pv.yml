name: Probe PlasmoVoice API
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Resolve
        run: |
          mkdir -p /tmp/p && cd /tmp/p
          cat > settings.gradle <<'S'
          rootProject.name='p'
          S
          cat > build.gradle <<'S'
          plugins { id 'java' }
          repositories { mavenCentral(); maven { url 'https://repo.plasmoverse.com/releases' } }
          dependencies { compileOnly 'su.plo.voice.api:server:2.1.9' }
          tasks.register('cp') { doLast { configurations.compileClasspath.files.each { println it } } }
          S
          gradle cp -q --no-daemon 2>&1 | tail -40
      - name: Classes
        run: |
          cd /tmp/p
          mkdir -p ex && for j in $(gradle cp -q --no-daemon 2>/dev/null | grep '\.jar$'); do (cd ex && unzip -qo $j 2>/dev/null); done
          CP=$(gradle cp -q --no-daemon 2>/dev/null | grep '\.jar$' | tr '\n' ':')
          echo "CP=$CP"
          for c in su.plo.voice.api.server.audio.capture.ServerActivation su.plo.voice.api.server.audio.capture.ServerActivationManager su.plo.voice.api.server.audio.source.ServerBroadcastSource su.plo.voice.api.server.audio.source.BaseServerSource su.plo.voice.api.server.player.VoiceServerPlayerManager su.plo.voice.api.server.player.VoicePlayer su.plo.voice.api.server.player.VoiceServerPlayer su.plo.voice.api.server.audio.line.ServerSourceLineManager su.plo.voice.api.server.audio.line.BaseServerSourceLine su.plo.voice.api.addon.AddonsLoader su.plo.voice.api.addon.annotation.Addon su.plo.voice.api.addon.AddonInitializer su.plo.voice.api.addon.annotation.InjectPlasmoVoice su.plo.voice.api.server.audio.capture.ServerActivation\$Builder su.plo.voice.api.server.audio.line.ServerSourceLine\$Builder su.plo.voice.api.server.event.audio.source.ServerSourceAudioPacketEvent su.plo.voice.api.server.event.player.PlayerSpeakEvent; do echo "=== $c"; javap -cp "$CP" "$c" 2>&1 | head -60; done
          for d in $(find ex -name '*.class' | grep -iE 'Broadcast|Activation|Speak' | head -60); do echo $d; done
