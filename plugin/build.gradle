plugins {
    id 'java'
}

group = 'ro.solarstudios'
version = '1.0.0'

// Compilat pentru Java 8 si API-ul 1.16.5: acelasi jar merge pe serverele 1.16.5 (Mohist) si 1.20.1 (Arclight)
java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
    mavenCentral()
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    // API-ul serverului Plasmo Voice 2.1.x (doar la compilare; pluginul merge si fara el)
    maven {
        url = 'https://repo.plasmoverse.com/releases'
        content { includeGroupByRegex 'su\\.plo.*' }
    }
}

dependencies {
    compileOnly 'org.spigotmc:spigot-api:1.16.5-R0.1-SNAPSHOT'
    compileOnly 'su.plo.voice.api:server:2.1.9'
    compileOnly 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.release = 8
}

test {
    useJUnitPlatform()
}

processResources {
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

jar {
    archiveFileName = "FlowCityBridge-${project.version}.jar"
}
