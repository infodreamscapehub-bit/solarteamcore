# FlowCity - modulul Hype (SolarStudios). Valorile lipsa se iau din acest fisier din jar.
# Comenzi: /atm /hud /job /sete /cnn /prop /roata /buletin /permis /arata /doc /hype /clearlag
# Permisiuni: flowcity.hype.admin, flowcity.hype.cnn, flowcity.hype.cnn.delete, flowcity.hype.doc, flowcity.hype.clearlag

# Starea trimisa in HUD (rangurile se cauta in ordine dupa permisiune)
hud:
  default-rank: "Jucator"
  ranks:
    - {perm: "flowcity.rank.owner", name: "Owner"}
    - {perm: "flowcity.rank.admin", name: "Admin"}
    - {perm: "flowcity.rank.mod", name: "Moderator"}
    - {perm: "flowcity.rank.vip", name: "VIP"}

atm:
  fee-percent: 1.0          # taxa de transfer (% din suma); 0 = fara
  fee-min: 0.5              # taxa minima per transfer (daca fee-percent > 0)
  min-amount: 1.0
  max-per-transaction: 1000000
  daily-withdraw-limit: 0   # 0 = fara limita
  daily-transfer-limit: 0
  command-anywhere: true    # /atm functioneaza oriunde; false = doar langa un ATM fizic
  max-distance: 6           # distanta maxima fata de ATM cand command-anywhere=false

jobs:
  change-cooldown-minutes: 60
  xp-base: 100              # XP pentru nivelul 1 -> 2
  xp-growth: 1.35           # inmultire pe nivel
  max-level: 50
  bonus-per-level: 0.03     # +3% plata pe nivel
  placed-ttl-minutes: 180   # blocurile puse de jucatori nu platesc cat timp sunt in set
  placed-max: 60000
  trash-block: CAULDRON     # Gunoier: click dreapta cu un obiect pe acest bloc
  list:
    courier:
      name: "Curier"
      desc: "Ridica coletele de la depozit si le duci la adresele din oras."
      summary: "Livrari: baza + bonus la distanta"
      category: "Livrari"
      difficulty: "Mediu"
      tasks:
        - "Mergi la depozitul de colete"
        - "Primesti automat o adresa pe harta (GPS)"
        - "Du coletul la destinatie si primesti plata"
      delivery: {item: "coletul", radius: 4, base-pay: 12, per-100m: 5, xp: 6}
    pizzachef:
      name: "Pizzaiolo"
      desc: "Ia pizza calda de la pizzerie si o livrezi clientilor."
      summary: "Livrari de pizza: baza + bonus la distanta"
      category: "Livrari"
      difficulty: "Usor"
      tasks:
        - "Intra in pizzerie, la punctul de ridicare"
        - "Urmeaza GPS-ul pana la client"
        - "Livreaza cat mai repede"
      delivery: {item: "pizza", radius: 4, base-pay: 8, per-100m: 4, xp: 5}
    trucker:
      name: "Camionist"
      desc: "Transporti marfa intre depozite, pe distante lungi."
      summary: "Transport: baza mare + bonus la distanta"
      category: "Livrari"
      difficulty: "Greu"
      tasks:
        - "Ridica marfa de la terminal"
        - "Condu pana la depozitul indicat pe harta"
        - "Distantele lungi se platesc mai bine"
      delivery: {item: "marfa", radius: 6, base-pay: 40, per-100m: 6, xp: 12}
    miner:
      category: "Resurse"
      difficulty: "Mediu"
      tasks:
        - "Mergi in mina si sparge minereuri"
        - "Vinde-ti resursele sau pastreaza-le"
        - "Creste in nivel pentru bonus la plata"
      name: "Miner"
      desc: "Sparge minereuri si primesti bani si XP."
      summary: "Minereuri: 1.5-8$ / bloc"
      limit-per-minute: 40
      rules:
        - {event: break, materials: [COAL_ORE], pay: 1.5, xp: 3}
        - {event: break, materials: [IRON_ORE, NETHER_QUARTZ_ORE, NETHER_GOLD_ORE], pay: 3, xp: 5}
        - {event: break, materials: [GOLD_ORE, LAPIS_ORE, REDSTONE_ORE], pay: 4, xp: 6}
        - {event: break, materials: [DIAMOND_ORE, EMERALD_ORE], pay: 8, xp: 12}
        - {event: break, materials: [ANCIENT_DEBRIS], pay: 15, xp: 20}
    fisher:
      category: "Resurse"
      difficulty: "Usor"
      tasks:
        - "Ia o undita si mergi la apa"
        - "Pescuieste pesti si obiecte rare"
        - "Fiecare captura se plateste"
      name: "Pescar"
      desc: "Pescuieste pesti cu undita."
      summary: "Peste prins: 3-12$"
      limit-per-minute: 12
      rules:
        - {event: fish, materials: [COD, SALMON], pay: 3, xp: 5}
        - {event: fish, materials: [TROPICAL_FISH, PUFFERFISH], pay: 6, xp: 8}
        - {event: fish, materials: [NAUTILUS_SHELL, NAME_TAG, SADDLE, ENCHANTED_BOOK, BOW, FISHING_ROD], pay: 12, xp: 15}
    farmer:
      category: "Resurse"
      difficulty: "Usor"
      tasks:
        - "Recolteaza doar culturile coapte"
        - "Replanteaza ca sa ai de lucru"
        - "Platesti-te pe fiecare bucata"
      name: "Fermier"
      desc: "Recolteaza culturi coapte."
      summary: "Culturi coapte: 1-2.5$ / bucata"
      limit-per-minute: 60
      rules:
        - {event: break, materials: [WHEAT, CARROTS, POTATOES, BEETROOTS, NETHER_WART], mature: true, placed-check: false, pay: 1.2, xp: 2}
        - {event: break, materials: [PUMPKIN, MELON], pay: 2.5, xp: 3}
        - {event: break, materials: [SWEET_BERRY_BUSH, COCOA], mature: true, placed-check: false, pay: 1.5, xp: 2}
    lumberjack:
      category: "Resurse"
      difficulty: "Usor"
      tasks:
        - "Taie copaci cu toporul"
        - "Lemnul exotic se plateste mai bine"
        - "Planteaza butasi dupa taiere"
      name: "Padurar"
      desc: "Taie copaci."
      summary: "Busteni: 1.2-1.8$ / bustean"
      limit-per-minute: 50
      rules:
        - {event: break, materials: ["*_LOG", "*_STEM"], pay: 1.2, xp: 2}
        - {event: break, materials: [DARK_OAK_LOG, JUNGLE_LOG, ACACIA_LOG], pay: 1.8, xp: 3}
    gardener:
      category: "Resurse"
      difficulty: "Usor"
      tasks:
        - "Aduna flori de pe teren"
        - "Planteaza butasi noi"
        - "Primesti plata pe fiecare"
      name: "Gradinar"
      desc: "Aduna flori si planteaza butasi."
      summary: "Flori: 1.5$, butasi: 0.8$"
      limit-per-minute: 40
      rules:
        - {event: break, materials: [DANDELION, POPPY, BLUE_ORCHID, ALLIUM, AZURE_BLUET, "*_TULIP", OXEYE_DAISY, CORNFLOWER, LILY_OF_THE_VALLEY, SUNFLOWER, LILAC, ROSE_BUSH, PEONY], pay: 1.5, xp: 2}
        - {event: place, materials: ["*_SAPLING"], pay: 0.8, xp: 1}
    electrician:
      category: "Servicii"
      difficulty: "Mediu"
      tasks:
        - "Instaleaza redstone, lampi si repetitoare"
        - "Foloseste obiecte puse chiar de tine"
        - "Plata pe fiecare instalatie"
      name: "Electrician"
      desc: "Instaleaza instalatii: redstone, lampi, repetitoare."
      summary: "Instalatii plasate: 1-2.5$"
      limit-per-minute: 30
      rules:
        - {event: place, materials: [REDSTONE_WIRE, REDSTONE_TORCH, REPEATER, COMPARATOR], pay: 1.0, xp: 1}
        - {event: place, materials: [REDSTONE_LAMP, LEVER, "*_BUTTON", "*_PRESSURE_PLATE", OBSERVER, DAYLIGHT_DETECTOR], pay: 2.0, xp: 2}
    garbage:
      category: "Servicii"
      difficulty: "Usor"
      tasks:
        - "Strange gunoiul din oras"
        - "Da click dreapta pe un cos cu gunoi in mana"
        - "Primesti plata pe obiect"
      name: "Gunoier"
      desc: "Da click dreapta pe un cos (cazan) cu gunoi in mana."
      summary: "Gunoi aruncat: 0.5-1$ / obiect"
      limit-per-minute: 40
      rules:
        - {event: trash, materials: [ROTTEN_FLESH, STICK, BONE, STRING, SPIDER_EYE, PAPER, GLASS_BOTTLE, LEATHER, FEATHER, BOWL, POISONOUS_POTATO], pay: 0.5, xp: 1}
        - {event: trash, materials: [GUNPOWDER, SLIME_BALL, INK_SAC, FLINT], pay: 1.0, xp: 2}
    diver:
      category: "Resurse"
      difficulty: "Greu"
      tasks:
        - "Scufunda-te cu echipament"
        - "Aduna resurse de pe fundul apei"
        - "Obiectele rare platesc cel mai bine"
      name: "Scafandru"
      desc: "Colecteaza resurse de sub apa (kelp, bureti, muraturi)."
      summary: "Resurse subacvatice: 1-6$"
      limit-per-minute: 30
      rules:
        - {event: break, underwater: true, materials: [KELP, KELP_PLANT, SEAGRASS, TALL_SEAGRASS], pay: 1.0, xp: 1}
        - {event: break, underwater: true, materials: [SEA_PICKLE, "*_CORAL", "*_CORAL_FAN", "*_CORAL_BLOCK"], pay: 3.0, xp: 3}
        - {event: break, underwater: true, materials: [SPONGE, WET_SPONGE, PRISMARINE, PRISMARINE_BRICKS, DARK_PRISMARINE], pay: 6.0, xp: 6}

thirst:
  enabled: true
  drain-per-minute: 4.0      # puncte (din 100) pe minut, in repaus
  sprint-multiplier: 2.5
  swim-multiplier: 1.5
  respawn-value: 60
  damage-at-zero: 1.0        # damage la fiecare damage-interval-seconds
  damage-interval-seconds: 5
  lethal: false              # false = nu omoara (se opreste la min-health)
  min-health: 2.0
  warn-below: 20
  items:                     # materiale care hidrateaza (puncte)
    WATER_BOTTLE: 35
    POTION: 15
    MILK_BUCKET: 30
    MELON_SLICE: 10
    SWEET_BERRIES: 3
    APPLE: 4
    HONEY_BOTTLE: 8
    BEETROOT_SOUP: 6
    GLOW_BERRIES: 3

news:
  max-kept: 30
  publish-cooldown-seconds: 10
  banner-seconds: 9
  categories: [breaking, politie, eveniment, guvern]

property:
  pay-from: cash             # cash | bank
  refund-percent: 70
  limits:                    # per jucator, pe tip
    casa: 1
    apartament: 2
    business: 2
  max-total: 4
  types: [casa, apartament, business]

wheel:
  cooldown-hours: 24
  animation-seconds: 6
  prizes:                    # type: money | bank | item   (greutate = sansa relativa; announce: true = anunt in chat la castig)
    - {name: "100$",        type: money, amount: 100,  weight: 30, color: "#34D399"}
    - {name: "250$",        type: money, amount: 250,  weight: 22, color: "#22D3EE"}
    - {name: "500$",        type: money, amount: 500,  weight: 14, color: "#7C83FF"}
    - {name: "1000$",       type: money, amount: 1000, weight: 6,  color: "#FBBF24"}
    - {name: "5 Paini",     type: item,  material: BREAD, amount: 5, weight: 12, color: "#F59E0B"}
    - {name: "3 Diamante",  type: item,  material: DIAMOND, amount: 3, weight: 5, color: "#38BDF8", announce: true}
    - {name: "Mere aurii",  type: item,  material: GOLDEN_APPLE, amount: 2, weight: 7, color: "#F472B6"}
    - {name: "JACKPOT 5000$", type: money, amount: 5000, weight: 1, color: "#F87171", announce: true}

documents:
  buletin-valid-years: 10
  permis-valid-years: 10
  show-distance: 4
  address-max: 60

clearlag:
  enabled: true
  interval-minutes: 15
  warnings: [60, 30, 10, 5]
  exempt-named: true         # nu sterge obiectele cu nume custom
  exempt-materials: [DIAMOND, NETHERITE_INGOT, ELYTRA, SHULKER_BOX, TOTEM_OF_UNDYING, PAPER]
  worlds: []                 # gol = toate lumile


# Dealer auto (vehiculele din modul MrCrayfish's Vehicle). Plata se face prin Vault.
# entity = id-ul vehiculului din mod; engine / wheels = itemele cu care vine masina noua ("-" = fara).
# Poti adauga orice vehicul (si din alte addon-uri), doar sa existe pe server.
dealership:
  radius: 8
  vehicles:
    moped:
      name: "Scuter"
      entity: "vehicle:moped"
      category: "Doua roti"
      price: 4500
      engine: "vehicle:iron_small_engine"
      wheels: "vehicle:standard_wheel"
      desc: "Ieftin si economic, perfect prin oras."
    mini_bike:
      name: "Mini Bike"
      entity: "vehicle:mini_bike"
      category: "Doua roti"
      price: 6000
      engine: "vehicle:iron_small_engine"
      wheels: "vehicle:standard_wheel"
      desc: "Mic si agil."
    dirt_bike:
      name: "Motocross"
      entity: "vehicle:dirt_bike"
      category: "Doua roti"
      price: 12000
      engine: "vehicle:iron_small_engine"
      wheels: "vehicle:off_road_wheel"
      desc: "Pentru teren accidentat."
    smart_car:
      name: "Mini City"
      entity: "vehicle:smart_car"
      category: "Masini"
      price: 18000
      engine: "vehicle:iron_electric_engine"
      wheels: "vehicle:standard_wheel"
      desc: "Electrica, doua locuri, parcare oriunde."
    golf_cart:
      name: "Golf Cart"
      entity: "vehicle:golf_cart"
      category: "Masini"
      price: 9000
      engine: "vehicle:iron_electric_engine"
      wheels: "vehicle:standard_wheel"
      desc: "Electric, patru locuri, lent."
    go_kart:
      name: "Kart"
      entity: "vehicle:go_kart"
      category: "Sport"
      price: 15000
      engine: "vehicle:iron_small_engine"
      wheels: "vehicle:racing_wheel"
      desc: "Jos si rapid."
    dune_buggy:
      name: "Buggy"
      entity: "vehicle:dune_buggy"
      category: "Off-road"
      price: 14000
      engine: "vehicle:iron_small_engine"
      wheels: "vehicle:off_road_wheel"
      desc: "Trei roti, mult distractie."
    atv:
      name: "ATV"
      entity: "vehicle:atv"
      category: "Off-road"
      price: 16000
      engine: "vehicle:iron_small_engine"
      wheels: "vehicle:all_terrain_wheel"
      desc: "Merge pe orice teren."
    quad_bike:
      name: "Quad"
      entity: "vehicle:quad_bike"
      category: "Off-road"
      price: 17000
      engine: "vehicle:iron_small_engine"
      wheels: "vehicle:all_terrain_wheel"
      desc: "ATV mare, stabil."
    off_roader:
      name: "Off Roader"
      entity: "vehicle:off_roader"
      category: "Off-road"
      price: 32000
      engine: "vehicle:iron_large_engine"
      wheels: "vehicle:off_road_wheel"
      desc: "Patru locuri, tractiune puternica."
    mini_bus:
      name: "Microbuz"
      entity: "vehicle:mini_bus"
      category: "Utilitare"
      price: 38000
      engine: "vehicle:iron_large_engine"
      wheels: "vehicle:standard_wheel"
      desc: "Sase locuri, poate trage remorca."
    tractor:
      name: "Tractor"
      entity: "vehicle:tractor"
      category: "Utilitare"
      price: 26000
      engine: "vehicle:iron_large_engine"
      wheels: "vehicle:off_road_wheel"
      desc: "Pentru ferma, trage remorci agricole."
    speed_boat:
      name: "Barca rapida"
      entity: "vehicle:speed_boat"
      category: "Apa"
      price: 30000
      engine: "vehicle:iron_large_engine"
      wheels: "-"
      desc: "Pentru lac si mare."
    jet_ski:
      name: "Jet Ski"
      entity: "vehicle:jet_ski"
      category: "Apa"
      price: 20000
      engine: "vehicle:iron_small_engine"
      wheels: "-"
      desc: "Rapid pe apa."

# Garaje (in stil FiveM; garajele se creeaza in joc cu /garaj creeaza ...).
# pound-fee: taxa (Vault) ca sa-ti scoti masina de la pound. max-parking-fine: amenda maxima de parcare data de politie.
# factions: factiunile cu garaj propriu (in afara de politie, care vine din MDT). Membrii au permisiunea flowcity.faction.<nume>.
garages:
  pound-fee: 500
  max-parking-fine: 5000
  factions:
    - medici
    - primarie
