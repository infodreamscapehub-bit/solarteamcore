# E-shop FlowCity. Se deschide de la un NPC Citizens (comanda se ruleaza din consola, <p> = jucatorul care da click):
#   /npc command add shop open <p> <magazin> -c
# (acelasi format ca la dealer/tuning). Magazine: arme, magazine, backpackuri, permise.
#   De pe consola / command block: /shop open <jucator> <magazin>      Reincarcare: /shop reload
#
# Fiecare articol:
#   name:     numele afisat
#   item:     id-ul itemului (minecraft:iron_sword sau modid:item) - folosit pentru iconita si, daca nu ai "commands", pentru give
#   price:    pretul per bucata (RON)
#   amount:   cate bucati primesti la o cumparare (implicit 1)
#   desc:     descriere scurta (optional)
#   commands: (optional) comenzi rulate din consola in loc de give; %player% = cumparatorul, %amount% = amount
#   requires: (optional) permis necesar, ex: requires: port_arma  sau  requires: [port_arma, permis_vanatoare]
#             Id-urile sunt din permits.yml. Verificat pe server; in meniu articolul apare gri, cu lacat.
#   permit:   (optional) vinde un permis din permits.yml: {permit: port_arma} (numele, pretul si descrierea vin din permits.yml,
#             dar le poti suprascrie aici cu name/price/desc)
# Atentie: id-urile armelor depind de modul de arme instalat (verifica cu /give <nume> tab-complete).
radius: 12          # cat de departe de NPC poti cumpara dupa ce deschizi magazinul
shops:
  arme:
    title: "ARMURIE"
    categories:
      - name: "Pistoale"
        items:
          - {name: "M1911", item: "tac:m1911", price: 2500, desc: "Pistol clasic", requires: port_arma}
          - {name: "Glock 17", item: "tac:glock_17", price: 3000, desc: "Pistol 9mm", requires: port_arma}
      - name: "Pusti"
        items:
          - {name: "AK-47", item: "tac:ak47", price: 9000, desc: "Pusca de asalt", requires: port_arma}
          - {name: "M4A1", item: "tac:m4a1", price: 10000, desc: "Pusca de asalt", requires: port_arma}
      - name: "Munitie"
        items:
          - {name: "Munitie 9mm", item: "tac:pistol_ammo", price: 5, amount: 30, desc: "30 buc", requires: port_arma}
          - {name: "Munitie 5.56", item: "tac:rifle_ammo", price: 8, amount: 30, desc: "30 buc", requires: port_arma}
  magazine:
    title: "MAGAZIN"
    categories:
      - name: "Mancare"
        items:
          - {name: "Paine", item: "minecraft:bread", price: 10, amount: 4}
          - {name: "Friptura", item: "minecraft:cooked_beef", price: 25, amount: 4}
      - name: "Bauturi"
        items:
          - {name: "Apa", item: "minecraft:potion", price: 5}
      - name: "Unelte"
        items:
          - {name: "Sabie de fier", item: "minecraft:iron_sword", price: 150}
          - {name: "Tarnacop de fier", item: "minecraft:iron_pickaxe", price: 150}
  # Useful Backpacks (usefulbackpacks)
  backpackuri:
    title: "RUCSACURI"
    categories:
      - name: "Rucsacuri"
        items:
          - {name: "Rucsac mic", item: "usefulbackpacks:backpack_small", price: 500, desc: "Spatiu mic"}
          - {name: "Rucsac mediu", item: "usefulbackpacks:backpack_medium", price: 1500, desc: "Spatiu mediu"}
          - {name: "Rucsac mare", item: "usefulbackpacks:backpack_large", price: 4000, desc: "Spatiu mare"}
          - {name: "Rucsac Ender", item: "usefulbackpacks:backpack_enderchest", price: 8000, desc: "Legat de Ender Chest"}
      - name: "Accesorii"
        items:
          - {name: "Filtru ridicare (item)", item: "usefulbackpacks:filter_item", price: 150, desc: "Ridica automat un item"}
          - {name: "Filtru ridicare (tag)", item: "usefulbackpacks:filter_tag", price: 150, desc: "Ridica automat dupa tag"}
          - {name: "Configurator filtre", item: "usefulbackpacks:filter_configurator", price: 300, desc: "Bloc pentru filtre"}
  # Permise (preturile se schimba in permits.yml). Se leaga de un NPC la Primarie / Politie.
  permise:
    title: "PERMISE"
    categories:
      - name: "Permise"
        items:
          - {permit: port_arma}
          - {permit: permis_vanatoare}
          - {permit: licenta_afaceri}
