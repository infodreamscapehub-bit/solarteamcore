# FlowCityBridge - SolarStudios
server-name: "FlowCity"

eadmin:
  ss-notify: true   # anunta jucatorul in chat cand staff-ul cere o captura de ecran
  # Comenzi blocate cat timp un jucator are mute activ
  muted-blocked-commands: [msg, tell, w, r, me, say, reply]
  # Flag automat: mai mult de N comenzi in fereastra de mai jos
  command-spam:
    max-commands: 8
    window-seconds: 3
  # Obiecte care declanseaza flag HIGH daca sunt luate din creativ
  creative-blacklist: [BEDROCK, COMMAND_BLOCK, CHAIN_COMMAND_BLOCK, REPEATING_COMMAND_BLOCK, BARRIER, STRUCTURE_BLOCK, JIGSAW, SPAWNER]
  # Tranzactii (API) peste aceasta suma primesc flag
  big-transaction-threshold: 1000000
  # Cate randuri de log se pastreaza (zile); 0 = nelimitat
  log-retention-days: 45

ids:
  start: 1            # primul ID atribuit (ex. 100 ca sa porneasca de la #100)
  tab-prefix: false   # true = afiseaza #ID in lista de jucatori (TAB)
  overhead: true      # afiseaza #ID deasupra capului jucatorilor (pentru cei cu modul instalat)

notify:
  max-kept: 50        # cate notificari se pastreaza per jucator

update:
  enabled: true                       # verifica periodic GitHub pentru versiuni noi
  repo: "infodreamscapehub-bit/solarteamcore"
  check-minutes: 30
  auto-download: false                # true = descarca singur noul plugin in plugins/update

phone:
  # true = ai nevoie de un telefon (item flowcitycore:phone*) in inventar pentru mesaje/apeluri
  require-item: true
  call:
    ring-timeout-seconds: 30        # dupa cate secunde apelul nesunat devine "pierdut"
    max-minutes: 0                  # durata maxima a unui apel (0 = nelimitat)
    cost-per-minute: 0              # cost pe minut platit de apelant la sfarsit (din banca, apoi cash); 0 = gratuit
    voice-hint: false               # true = la raspuns, mesaj "folositi chatul vocal" in chat
    # cine primeste apelurile catre 112 (jucatorii cu cel putin una din permisiuni)
    emergency-permissions:
      - flowcity.politie.officer
      - flowcity.ems.officer
