  esarfa:
    name: Eșarfă
    slot: accesoriu
    price: 90
    file: pieces/esarfa.png
  tricou_rosu:
    name: Tricou roșu
    slot: top
    price: 140
    file: pieces/tricou_rosu.png
  pantaloni_jeans:
    name: Blugi
    slot: pantaloni
    price: 160
    file: pieces/pantaloni_jeans.png
  ghete:
    name: Ghete
    slot: pantofi
    price: 180
