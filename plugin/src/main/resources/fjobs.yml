# ===========================================================================
# FlowCity Jobs (FJobs) - Job Center. Se editeaza aici; din joc (cu flowcity.fjobs.admin)
# adminii pot schimba din GUI: activ/premium/salariu estimat/nivel/locuri/multiplicator si
# punctele de livrare/ruta. Modificarile din GUI se salveaza in fjobs-admin.yml (suprascriu acest fisier).
#
# Statusuri (calculate automat, nimic nu e simulat):
#   FUNCTIONAL  = are logica reala (rules / delivery cu puncte / route cu puncte)
#   EXTERN      = se lucreaza in alt sistem (taxi, politie, EMS...); FJobs tine doar angajarea
#   IN PREGATIRE= nu are inca logica (sau lipsesc punctele setate de admin) -> nu se poate lua
# Ca sa activezi un job de tip delivery/route: du-te in joc la locul dorit, deschide Job Center
# -> Administrare -> job -> "Adauga punct aici".
# ===========================================================================
settings:
  xp-base: 100               # XP pentru nivelul 1 -> 2 al unui job
  xp-growth: 1.35
  max-level: 50
  bonus-per-level: 0.03      # +3% plata pe nivel de job
  change-cooldown-minutes: 30
  max-shift-minutes: 120     # tura se inchide automat dupa atat
  premium-enabled: false     # joburile premium se pot lua doar cu flowcity.fjobs.premium si doar daca e true
  placed-ttl-minutes: 180    # anti-farm: blocuri puse de jucatori
  placed-max: 60000
  trash-block: CAULDRON      # Gunoier: click dreapta cu un obiect pe acest bloc
  no-fly: true
  history-max: 40
  gps-integration: true      # trimite destinatia in GPS (/gps set) pentru livrari si rute
  profile-xp-base: 150       # nivelul profesional global (toate joburile)
  profile-xp-growth: 1.3
  profile-max-level: 100
  shift-bonus:               # bonus de performanta la finalul turei
    min-minutes: 10
    per-hour-target: 300     # castig/ora necesar
    percent: 10
  level-rewards:             # bani la atingerea nivelului unui job (o singura data per job)
    5: 100
    10: 300
    20: 800
    30: 1500
    50: 5000

