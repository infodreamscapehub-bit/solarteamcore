# CNN ANUNTURI - anunturi platite ale jucatorilor. Toate valorile se aplica la repornirea serverului.
# Banii se retrag prin Vault (sau economia interna FlowCity daca nu exista Vault), O SINGURA DATA, doar dupa validarea tuturor conditiilor.
enabled: true

# Taxele (in $)
fees:
  standard: 500.0      # anunt standard
  promoted: 1500.0     # anunt promovat (apare primul in lista, evidentiat)
  extend: 300.0        # prelungirea unui anunt

# Optiunile de durata pe care le poate alege jucatorul (ore)
durations-hours: [12, 24, 48, 72]

# Cooldown intre doua publicari (minute), salvat persistent pe server (nu se reseteaza la reconectare)
cooldown-minutes: 30

promoted:
  enabled: true
  # -1 = anunturile promovate respecta acelasi cooldown ca cele standard (recomandat, anti-spam)
  #  0 = anunturile promovate ocolesc cooldown-ul (explicit!);  >0 = cooldown propriu, in minute, doar intre promovate
  cooldown-minutes: -1
  broadcast: false     # true = toti jucatorii primesc o notificare la un anunt promovat nou

# Categorii CNN 2.0: id -> eticheta, culoare (hex), iconita (masina, casa, cheie, cutie, unealta, servieta, oameni, puncte), pret obligatoriu.
# (sectiunea veche "categories" de mai jos ramane doar pentru numele anunturilor vechi)
categories-v2:
  vand_auto: {label: "Vand automobile", color: "#E5484D", icon: "masina", price: true}
  cumpar_auto: {label: "Cumpar automobile", color: "#F2994A", icon: "masina", price: true}
  vand_prop: {label: "Vand proprietati", color: "#4DA3FF", icon: "casa", price: true}
  cumpar_prop: {label: "Cumpar proprietati", color: "#56CCF2", icon: "casa", price: true}
  inchiriez: {label: "Inchiriez", color: "#9B51E0", icon: "cheie", price: true}
  vand_obiecte: {label: "Vand obiecte", color: "#27AE60", icon: "cutie", price: true}
  cumpar_obiecte: {label: "Cumpar obiecte", color: "#6FCF97", icon: "cutie", price: true}
  servicii: {label: "Ofer servicii", color: "#F2C94C", icon: "unealta", price: false}
  caut_job: {label: "Caut loc de munca", color: "#2DD4BF", icon: "servieta", price: false}
  recrutare: {label: "Recrutare angajati", color: "#EB5757", icon: "oameni", price: false}
  diverse: {label: "Diverse", color: "#A0AEC0", icon: "puncte", price: false}

# Durata implicita aleasa in formular (ore; trebuie sa fie in durations-hours)
default-duration-hours: 24

# Editarea unui anunt: se pot schimba doar titlul, descrierea si pretul (NU categoria sau tipul -> pentru asta publici unul nou).
# Editarea NU reseteaza expirarea si NU consuma cooldown-ul de publicare; cu moderarea pornita anuntul editat reintra in asteptare.
edit:
  enabled: true
  fee: 0.0             # taxa pe editare
  max-edits: 3         # cate editari per anunt
  cooldown-minutes: 10 # pauza intre doua editari ale aceluiasi anunt

# Promovarea ulterioara a unui anunt standard activ (taxa diferentei); nu prelungeste anuntul.
promote:
  enabled: true
  fee: 1000.0

# Categorii vechi: id: eticheta afisata. Categoriile din price-categories cer pret.
categories:
  vand: "Vand"
  cumpar: "Cumpar"
  inchiriez: "Inchiriez"
  servicii: "Ofer servicii"
  job: "Caut loc de munca"
  recrutare: "Recrutare"
  diverse: "Diverse"
price-categories: [vand, cumpar, inchiriez]

limits:
  title-min: 5
  title-max: 48
  description-min: 10
  description-max: 240
  max-price: 1000000000
  max-active-per-player: 3     # anunturi active + in asteptare per jucator

# Anti-abuz
require-sim: true              # numarul din anunt = cartela SIM activa a autorului (nu se poate pune alt numar)
duplicate-hours: 24            # acelasi anunt (aceeasi categorie/titlu/descriere) nu se poate republica atata timp
block-links: true              # fara linkuri / invitatii Discord
blocked-words: []              # cuvinte interzise (fara diacritice, nu conteaza literele mari)

# Moderare: true = anunturile noi asteapta aprobarea staff-ului (permisiunea flowcity.ads.moderate)
moderation:
  enabled: false
  refund-on-reject: true       # taxa se returneaza daca anuntul e respins

extend:
  enabled: true
  hours: 24
  max-extends: 2

history-days: 7                # cat timp raman vizibile in "Anunturile mele" cele expirate/sterse
list-max: 150                  # cate anunturi publice se trimit clientului
