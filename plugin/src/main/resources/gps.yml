  MALL:         {name: "Mall",          group: "COMERCIALE", icon: mall,      color: "#F5A524"}
  MOMEALA:      {name: "Momeală",       group: "COMERCIALE", icon: bait,      color: "#35C6E0"}
  PRIMARIE_1:   {name: "Primărie Sector 1", group: "INSTITUȚII", icon: city_hall, color: "#E8F1FF"}
  PRIMARIE_2:   {name: "Primărie Sector 2", group: "INSTITUȚII", icon: city_hall, color: "#E8F1FF"}
  PRIMARIE_3:   {name: "Primărie Sector 3", group: "INSTITUȚII", icon: city_hall, color: "#E8F1FF"}
  PRIMARIE_4:   {name: "Primărie Sector 4", group: "INSTITUȚII", icon: city_hall, color: "#E8F1FF"}
  POLITIE:      {name: "Poliție",       group: "INSTITUȚII", icon: police,    color: "#4DA3FF"}
  POMPIERI:     {name: "Pompieri",      group: "INSTITUȚII", icon: fire,      color: "#F0584C"}
  TUNING:       {name: "Tuning",        group: "COMERCIALE", icon: tuning,    color: "#B7C4D6"}
  VAMA_A:       {name: "Vama A",        group: "INSTITUȚII", icon: border,    color: "#F5A524"}
  VAMA_B:       {name: "Vama B",        group: "INSTITUȚII", icon: border,    color: "#F5A524"}
  VAMA_C:       {name: "Vama C",        group: "INSTITUȚII", icon: border,    color: "#F5A524"}
  PESCUIT:      {name: "Zona Pescuit",  group: "SPECIALE",   icon: fishing,   color: "#35C6E0"}
  SPITAL:       {name: "Spital",        group: "INSTITUȚII", icon: hospital,  color: "#F0584C"}
  BANCA:        {name: "Bancă",         group: "COMERCIALE", icon: bank,      color: "#62D98F"}
  ATM:          {name: "ATM",           group: "PUBLICE",    icon: atm,       color: "#62D98F"}
  BENZINARIE:   {name: "Benzinărie",    group: "PUBLICE",    icon: fuel,      color: "#62D98F"}
  SERVICE:      {name: "Service Auto",  group: "COMERCIALE", icon: repair,    color: "#E9A23B"}
  MAGAZIN:      {name: "Magazine",      group: "COMERCIALE", icon: shop,      color: "#C792FF"}
  GARAJ:        {name: "Garaj",         group: "PUBLICE",    icon: garage,    color: "#4DA3FF"}
  DEALERSHIP:   {name: "Dealership",    group: "COMERCIALE", icon: dealer,    color: "#4DA3FF"}
  JOBURI:       {name: "Joburi",        group: "JOBURI",     icon: jobs,      color: "#F5A524"}
  RESTAURANT:   {name: "Restaurante",   group: "COMERCIALE", icon: restaurant, color: "#C792FF"}
  RECREERE:     {name: "Zone de recreere", group: "PUBLICE", icon: park,      color: "#62D98F"}
  EVENIMENTE:   {name: "Evenimente",    group: "SPECIALE",   icon: event,     color: "#FFC53D"}
  INCHISOARE:   {name: "Închisoare",    group: "INSTITUȚII", icon: prison,    color: "#8A97A8"}

# Locatii. Campuri: id (unic), name, category (cheia din categories), x, z, description, icon/color (optional, suprascriu categoria),
# enabled (true/false), dimension (optional).
# Garajele si benzinariile create cu /garaj si /benzinarie apar automat pe harta (nu trebuie adaugate aici).
# Exemplele de mai jos sunt dezactivate (enabled: false) si au coordonate 0 0: pune-le pe ale tale si schimba enabled in true,
# sau adauga din joc, de pe pozitia ta: /gps adauga POLITIE Sectia 1
locations:
  - {id: exemplu_primarie_1, name: "Primărie Sector 1", category: PRIMARIE_1, x: 0, z: 0, description: "Buletine, certificate și acte", enabled: false}
  - {id: exemplu_politie_1, name: "Poliție", category: POLITIE, x: 0, z: 0, description: "Secția de poliție", enabled: false}
  - {id: exemplu_spital_1, name: "Spital", category: SPITAL, x: 0, z: 0, description: "Urgențe și tratament", enabled: false}

# Zone RP: LEGAL (verde) sau ILEGAL (rosu). Poligon: lista de puncte [x, z] (minim 3), sau dreptunghi cu x1/z1/x2/z2.
# color: optional (#RRGGBB), altfel verde/rosu implicit. Zonele dezactivate (enabled: false) nu se trimit.
zones:
  - {id: exemplu_zona_legala, name: "Zona legală - Centru", type: LEGAL, x1: 0, z1: 0, x2: 0, z2: 0, enabled: false}
  - {id: exemplu_zona_ilegala, name: "Zona ilegală - Port", type: ILEGAL, points: [[0, 0], [0, 0], [0, 0]], enabled: false}
