# FlowCity - /help (alias /ajutor, /?). Toate comenzile, pe categorii. Se reincarca cu: /help reload  (permisiunea flowcity.help.admin).
#
# smallcaps: true  -> titlurile si etichetele din /help (si titlurile notificarilor) apar in ꜱᴍᴀʟʟ ᴄᴀᴘꜱ.
#                     Comutatorul e global: false opreste small caps si in notificari.
# title            -> antetul listei (se converteste in small caps daca smallcaps: true).
# page-size        -> cate comenzi pe pagina intr-o categorie.
# categories:
#   key      id-ul categoriei (/help <key>)
#   title    numele afisat
#   icon     simbol scurt in fata titlului
#   color    culoarea de inceput (#RRGGBB, birdflop-style); "to" = culoarea de sfarsit pentru gradient (optional)
#   commands lista de comenzi: usage (cum se scrie), desc (ce face), perm (permisiune; gol = oricine)
#            Comenzile cu "perm" apar doar celor care o au (OP vede tot). Prefixul "." = comanda din chat a modului (client).
smallcaps: true
title: "FlowCity ajutor"
subtitle: "Comenzile pe care le poți folosi. Click pe una ca s-o scrii în chat."
page-size: 8
footer-hint: "/help <categorie> [pagina]  ·  /help <comandă>"

categories:
  - key: bani
    title: "Bani și plăți"
    icon: "$"
    color: "#F6C15A"
    to: "#FF9A3C"
    commands:
      - {usage: "/banca", desc: "Deschide banca: cont, card, depuneri, retrageri și credite", perm: ""}
      - {usage: "/banca depune <sumă>", desc: "Depui cash-ul în contul bancar", perm: ""}
      - {usage: "/banca retrage <sumă>", desc: "Retragi bani din cont ca bancnote", perm: ""}
      - {usage: "/banca credit <sumă>", desc: "Ceri un credit (se plătește în rate)", perm: ""}
      - {usage: "/banca plateste", desc: "Plătești rata creditului", perm: ""}
      - {usage: "/atm deposit <sumă>", desc: "Depui cash-ul în banca ta (la ATM)", perm: "flowcity.hype.atm"}
      - {usage: "/atm withdraw <sumă>", desc: "Retragi bani ca bancnote în inventar", perm: "flowcity.hype.atm"}
      - {usage: "/atm transfer <jucător> <sumă>", desc: "Trimiți bani altui jucător", perm: "flowcity.hype.atm"}
      - {usage: "/payday", desc: "Salariul tău și în cât timp primești următorul PayDay (alias /salariu)", perm: ""}
      - {usage: "/amenzi", desc: "Îți vezi și plătești amenzile (cash sau card)", perm: ""}

  - key: joburi
    title: "Joburi"
    icon: "⚒"
    color: "#5FDC8F"
    to: "#2FD5D0"
