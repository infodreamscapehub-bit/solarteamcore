plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = '1.0.0'
group = 'ro.solarstudios.flowcity'
base { archivesName = 'FlowCityCore-1.20.1' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        configureEach {
            property 'forge.logging.console.level', 'info'
            mods {
                flowcitycore {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run-server')
            args '--nogui'
        }
        client {
            workingDirectory project.file('run')
        }
    }
}

repositories {
    mavenCentral()
    // portul MrCrayfish's Vehicle (Forge 1.20.1) si Framework, doar pentru compilare (bordul masinilor)
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
    // API PlasmoVoice 2.1.9 (doar la compilare; vocea ruleaza prin PlasmoVoice de pe server)
    compileOnly files('libs/plasmovoice-api.jar')
    // vehiculele MrCrayfish (port neoficial 1.20.1) - optionale la rulare: codul care le foloseste porneste doar daca modul "vehicle" e instalat
    compileOnly fg.deobf('curse.maven:mrcrayfishs-vehicle-unofficial-1511699:7921233')
    compileOnly fg.deobf('curse.maven:framework-549225:6531428')
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            "Specification-Title"     : "flowcitycore",
            "Specification-Vendor"    : "SolarStudios",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.jar.archiveVersion,
            "Implementation-Vendor"   : "SolarStudios",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
